# Umgebung des Plattform-Runners.
#
# Gauge läuft hier im Backend-Container, nicht auf dem Entwicklerrechner:
# "localhost" wäre der Container selbst. Deshalb stehen hier die Dienstnamen aus
# dem Docker-Netz der Demo. Für Läufe aus der IDE bleibt "default" mit localhost.
#
# Kafka braucht zwingend den internen Listener: Redpanda advertised nach außen
# "localhost:19092" — ein Client im Container liefe damit erneut ins Leere.

ORDER_API_URL        = http://order-service:8080
ORDER_PROJECTION_URL = http://order-projection:8082
ORDER_UI_URL         = http://order-ui:8083
KAFKA_BROKERS        = redpanda:9092
SCHEMA_REGISTRY_URL  = http://redpanda:8081
